name: iOS Build - Slim IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gboard-keyboard

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    env:
      SCHEME: J2MEEmulator
      CONFIGURATION: Release
      DEPLOYMENT_TARGET: "16.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.6.app"

          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Xcode 26.6 not found"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "J2MEEmulator.xcodeproj/project.pbxproj" ]; then
            echo "PROJECT_PATH=J2MEEmulator.xcodeproj" >> "$GITHUB_ENV"
          elif [ -f "J2MEEmulator/J2MEEmulator.xcodeproj/project.pbxproj" ]; then
            echo "PROJECT_PATH=J2MEEmulator/J2MEEmulator.xcodeproj" >> "$GITHUB_ENV"
          else
            echo "J2MEEmulator.xcodeproj not found"
            find . -name "*.xcodeproj" -maxdepth 4 -print
            exit 1
          fi

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            clean

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$PWD/build/J2MEEmulator.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            VALID_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            DWARF_DSYM_FILE_SHOULD_ACCOMPANY_PRODUCT=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Slim app payload
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build/J2MEEmulator.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "=== Before slim ==="
          du -sh "$APP_PATH"
          find "$APP_PATH" -type f -print0 | xargs -0 du -h | sort -h | tail -30

          # The old IPA contains the real SoundFont:
          #   gs_instruments.sf2
          # A broken packaging step can additionally leave:
          #   gs_instruments.sf2.partaa
          #   gs_instruments.sf2.partab
          #
          # Keep the normal .sf2 and remove ONLY split parts when the
          # complete .sf2 already exists. This avoids deleting required
          # data when a split file is genuinely the only copy.
          while IFS= read -r -d '' SF2; do
            base="${SF2%.*}"
            if [ -f "$SF2" ]; then
              for part in "${SF2}.partaa" "${SF2}.partab" "${SF2}.partac" "${SF2}.partad"; do
                if [ -f "$part" ]; then
                  echo "Removing duplicate split SoundFont: $part"
                  rm -f "$part"
                fi
              done
            fi
          done < <(find "$APP_PATH" -type f -name "*.sf2" -print0)

          # Remove common packaging-only metadata.
          find "$APP_PATH" -type d -name "__MACOSX" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -type f \( \
            -name ".DS_Store" -o \
            -name "*.dSYM" \
          \) -delete 2>/dev/null || true

          echo "=== After slim ==="
          du -sh "$APP_PATH"
          find "$APP_PATH" -type f -print0 | xargs -0 du -h | sort -h | tail -30

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/Payload build/J2MEEmulator-slim.ipa
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          # IPA is a ZIP container. Store already-compressed/binary data
          # normally; do not add unnecessary files.
          (
            cd build
            /usr/bin/zip -qry \
              J2MEEmulator-slim.ipa \
              Payload
          )

          echo "=== Final IPA ==="
          ls -lh build/J2MEEmulator-slim.ipa

          echo "=== Final archive contents ==="
          unzip -l build/J2MEEmulator-slim.ipa | tail -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: J2MEEmulator-slim-ipa
          path: build/J2MEEmulator-slim.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: J2MEEmulator-build-diagnostics
          path: |
            build/J2MEEmulator.xcarchive/Info.plist
            build/J2MEEmulator-slim.ipa
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
